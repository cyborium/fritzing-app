[project]
name = "fritzing-mcp"
version = "0.1.0"
description = "MCP Server for controlling Fritzing EDA via AI"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --cov=fritzing_mcp --cov-report=term-missing --cov-fail-under=95"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 8
